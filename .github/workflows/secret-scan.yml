name: secret-scan

# Scans the full git history for secrets with gitleaks. Hardened so that a pull
# request cannot weaken the check that judges it: the gitleaks config and ignore
# list are taken from the default branch, never from the change under review,
# and inline "gitleaks:allow" comments are ignored. A pull request that changes
# the scan itself must say so on a "Secret scan change:" line in its description.
# See docs/hierarchy.md, Break glass.

on:
  pull_request:
    # edited: the description or the base branch changed, so the scan-change note must be judged again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['**']

permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # Pinned here, not read from the release, so a tampered release cannot swap both.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The only branch whose .gitleaks.toml and .gitleaksignore are trusted.
      POLICY_REF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an explicit note when the scan itself changes
        if: github.event_name == 'pull_request'
        env:
          # Passed as environment, never interpolated into the script.
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The scan cannot protect against changes to itself (docs/hierarchy.md, Break glass).
          # A pull request that touches the scan must say so in its description, so the owner
          # reads those files line by line before merging.
          if ! git rev-parse --verify --quiet "origin/${PR_BASE_REF}^{commit}" >/dev/null; then
            echo "::error::base branch origin/${PR_BASE_REF} not found in the checkout"
            exit 1
          fi
          changed="$(git diff --name-only "origin/${PR_BASE_REF}...HEAD" -- .github/workflows .githooks/pre-commit .gitleaks.toml .gitleaksignore)"
          [ -n "$changed" ] || { echo "The scan itself is unchanged."; exit 0; }
          echo "This pull request changes the secret scan:"
          echo "$changed" | sed 's/^/  /'
          # A plain line, a list item, a heading or bold text; the note itself must not be empty.
          if ! printf '%s\n' "$PR_BODY" | grep -Eaq '^[[:space:]]*([-*+>]+[[:space:]]*)?(#+[[:space:]]*)?(\*\*)?Secret scan change:(\*\*)?[[:space:]]*[^[:space:]]'; then
            echo "::error::The pull request description must contain a line starting with 'Secret scan change:' (plain, as a list item, heading or in bold) that says what changes in the scan and why, with a link to the issue if there is one. The check runs again when the description is edited. See docs/hierarchy.md, Break glass."
            exit 1
          fi

      - name: Require the pre-commit hook to be executable
        run: |
          mode="$(git ls-files -s .githooks/pre-commit | cut -d' ' -f1)"
          if [ "$mode" != "100755" ]; then
            echo "::error file=.githooks/pre-commit::mode is ${mode:-missing}, expected 100755. Fix with: git update-index --chmod=+x .githooks/pre-commit"
            exit 1
          fi

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Use the gitleaks config and ignore list from the default branch only
        run: |
          rm -f .gitleaks.toml .gitleaksignore
          if ! git rev-parse --verify --quiet "origin/${POLICY_REF}^{commit}" >/dev/null; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::error::trusted branch origin/${POLICY_REF} not found"
              exit 1
            fi
            # Only the first push to an empty repository gets here; nothing can be merged yet.
            echo "::notice::trusted branch origin/${POLICY_REF} not found, scanning with gitleaks defaults"
            exit 0
          fi
          for f in .gitleaks.toml .gitleaksignore; do
            if git cat-file -e "origin/${POLICY_REF}:${f}" 2>/dev/null; then
              git show "origin/${POLICY_REF}:${f}" > "$f"
              echo "Using ${f} from ${POLICY_REF}"
            else
              echo "No ${f} on ${POLICY_REF}, gitleaks defaults apply"
            fi
          done

      - name: Check that the trusted config keeps the default rules and extends nothing from the checkout
        run: |
          [ -f .gitleaks.toml ] || exit 0
          if ! grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' .gitleaks.toml; then
            echo "::error file=.gitleaks.toml::.gitleaks.toml on ${POLICY_REF} must set useDefault = true under [extend]"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(path|url)[[:space:]]*=' .gitleaks.toml; then
            echo "::error file=.gitleaks.toml::.gitleaks.toml on ${POLICY_REF} must not extend from a path or URL; a path resolves inside the change under review"
            exit 1
          fi

      - name: Scan full history
        # Only the history of the commit under review (the merge result for a pull request).
        # Without --log-opts gitleaks scans every ref the checkout fetched, so a secret on an
        # unrelated branch would fail every run in the repository.
        run: ./gitleaks git --redact --no-banner --ignore-gitleaks-allow --log-opts="--full-history HEAD" .
